# Grouped weekly updates: one PR per group per week instead of a stream of
# single-package PRs. Based on documentation-actions examples/dependabot.yml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Kyiv
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Kyiv
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    labels: [dependencies]
    open-pull-requests-limit: 5
