# Label + one self-updating comment when a PR (forks included) adds an entry to
# README.md without the matching website/docs page. The comment names the docs
# file, section and exact line to add; it flips to "resolved" and the
# needs-docs-sync label is removed once the PR is in sync.
# pull_request_target is safe here: the reusable job checks out the base branch
# only and reads the PR through the API; no PR code is checked out or run.
name: Docs sync feedback

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'website/docs/**/*.md'
  workflow_dispatch:
    inputs:
      pr-number:
        description: PR number to (re)check
        required: true
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  feedback:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-sync-feedback.yml@v2
    with:
      # Same setting as readme-docs-sync-check.yml, so both agree on "in sync".
      pass-if-links-in-docs: true
      check-name: check-sync (README ↔ Docs sync)
      pr-number: ${{ inputs.pr-number || '' }}
