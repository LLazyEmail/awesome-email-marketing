name: README ↔ Docs sync check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'website/docs/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect README-only changes
        id: check
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          README_CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -c '^README.md$' || true)
          DOCS_CHANGED=$(git diff --name-only "$BASE" "$HEAD" | grep -c '^website/docs/.*\.md$' || true)

          echo "readme_changed=$README_CHANGED" >> "$GITHUB_OUTPUT"
          echo "docs_changed=$DOCS_CHANGED" >> "$GITHUB_OUTPUT"

          if [ "$README_CHANGED" -gt 0 ] && [ "$DOCS_CHANGED" -eq 0 ]; then
            echo "missing_docs=true" >> "$GITHUB_OUTPUT"
          else
            echo "missing_docs=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if docs page missing
        if: steps.check.outputs.missing_docs == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const body = `### Docs sync check

            This PR updates \`README.md\` but does not touch any file under \`website/docs/\`.

            For awesome-list entries please also update the matching Docusaurus page so the published site stays in sync.

            Common mappings:
            - Deliverability & Testing Tools → \`website/docs/tools/deliverability-tools.md\`
            - Growth & Automation Tools → \`website/docs/tools/growth-automation-tools.md\`
            - HTML email templates → \`website/docs/development/html-email-templates.md\`
            - Email work tools → \`website/docs/tools/email-work-tools.md\`
            - Ecommerce → \`website/docs/tools/ecommerce.md\`

            After adding the docs change, this check will pass.`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Fail if docs missing
        if: steps.check.outputs.missing_docs == 'true'
        run: |
          echo "::error::README.md changed but no matching website/docs/**/*.md file was updated."
          exit 1
