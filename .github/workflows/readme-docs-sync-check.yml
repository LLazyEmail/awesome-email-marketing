name: README ↔ Docs sync check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'README.md'
      - 'website/docs/**/*.md'

permissions:
  contents: read
  pull-requests: write

jobs:
  check-sync:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-readme-sync.yml@v2
    with:
      # Pass README-only PRs whose added links are already on a docs page
      pass-if-links-in-docs: true
      # docs-sync-feedback.yml posts the (specific, self-updating) comment instead
      post-comment: false
    secrets: inherit
