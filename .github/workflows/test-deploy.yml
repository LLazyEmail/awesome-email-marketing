name: Test deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - 'website/**'
      - '.github/workflows/**'

jobs:
  test-deploy:
    name: Test build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check docs link density
        run: npm run lint:docs-links

      - name: Build website
        run: npm run build