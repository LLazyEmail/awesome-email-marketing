name: Update changelog

# Push, not pull_request: a merged fork PR runs pull_request with a
# read-only GITHUB_TOKEN, and github-actions[bot] is then denied on push.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'website/src/data/changelog.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-changelog.yml@main
    with:
      working-directory: website
      cache-dependency-path: website/package-lock.json
      commit-paths: CHANGELOG.md website/src/data/changelog.json
    secrets: inherit
