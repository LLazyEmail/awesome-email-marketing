name: Label conflicted PRs

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-label-conflicted-prs.yml@main
    secrets: inherit
