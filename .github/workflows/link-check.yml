name: Link check

on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'website/docs/**'
      - '.github/workflows/link-check.yml'
      - '.lychee.toml'
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  lychee:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-link-check.yml@main
    with:
      args: >-
        --verbose
        --no-progress
        --max-concurrency 8
        --accept 200,204,206,403,429
        --timeout 20
        --exclude-path node_modules
        --exclude-path website/node_modules
        --exclude-path website/build
        --exclude-path .git
        README.md
        CHANGELOG.md
        'website/docs/**/*.md'
        'website/docs/**/*.mdx'
      create-issue: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      issue-title: 'Link check report (lychee)'
    secrets: inherit
