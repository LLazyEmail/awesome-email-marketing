name: Auto-rebase open PRs

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Attempt to update branches of open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              // Only try if it looks out of date
              if (pr.mergeable_state === 'behind' || pr.mergeable_state === 'dirty' || pr.mergeable_state === 'unknown') {
                try {
                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number,
                    expected_head_sha: pr.head.sha
                  });
                  console.log(`Updated branch for PR #${pr.number}`);
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: pr.number,
                    body: '✅ Automatically updated this PR branch with the latest changes from main.'
                  });
                } catch (err) {
                  console.log(`Could not update PR #${pr.number}: ${err.message}`);
                  // Optionally comment only once — skip if we already commented recently
                  if (err.status === 403) {
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: '⚠️ This PR is out of date with main. Maintainers cannot update the branch (fork permissions). Please enable "Allow edits from maintainers" or rebase/merge main yourself.'
                    }).catch(() => {});
                  }
                }
              }
            }
