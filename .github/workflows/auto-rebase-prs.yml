name: Auto-rebase open PRs

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  workflow_dispatch:
    inputs:
      pr-numbers:
        description: Comma-separated PR numbers; empty selects all open PRs
        type: string
        default: ''
      rebase-conflicts:
        description: Allow git rebase and force-push with lease for conflicts
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase:
    uses: LLazyEmail/documentation-actions/.github/workflows/reusable-auto-rebase.yml@v2
    with:
      pr-numbers: ${{ inputs.pr-numbers || '' }}
      rebase-conflicts: ${{ inputs.rebase-conflicts || false }}
      # When a rebase-conflicts dispatch hits a conflict but GitHub says the PR
      # is mergeable, do a normal merge update (no force-push) instead of failing.
      merge-fallback: true
      # Contributor (fork) PRs that conflict or can't be pushed to are replayed
      # into supersede/pr-N here and opened as a draft PR that starts with
      # "Supersedes #N" (the fork is never pushed to). Addition-only conflicts in
      # list files keep both entries; anything else is reported on the PR.
      supersede-fork-prs: true
      supersede-union-paths: 'README.md website/docs/**/*.md'
      # A PR that edits a workflow main has since deleted (e.g. #457 after #456):
      # accept main's deletion instead of failing, and list the dropped file on
      # the PR. Only for .github/workflows/**, and only if that's the sole conflict.
      # Also lets merge-fallback try a local merge when GitHub says "not mergeable".
      resolve-deleted-on-main: true
      # Other conflicts: one typed report comment on the PR, plus the same
      # has-conflicts label label-conflicted-prs.yml uses. A conflict hit during
      # a rebase-conflicts dispatch stays a warning instead of red.
      fail-on-conflict: false
      conflict-label: has-conflicts
      # Make PRs this run can't fix visible (DA v2.16.0+): a sweep that skips a
      # conflicting PR turns the run red, and PRs whose checks are red get a
      # warning, a summary column and the checks-failing label. Check names need
      # the AUTO_REBASE_TOKEN secret (a PAT that can read checks); without it the
      # action uses GitHub's "unstable" merge state.
      fail-on-skipped-conflicts: true
      report-failing-checks: true
      failing-checks-label: checks-failing
    secrets: inherit
