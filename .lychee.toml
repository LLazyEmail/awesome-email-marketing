# Lychee config for awesome-email-marketing
# CI workflow keeps fail:false so flaky external links never hard-fail PRs.
# Scheduled Monday runs publish a job summary (+ best-effort issue).
#
# lychee only auto-loads `lychee.toml`, so link-check.yml passes this file
# with the reusable-link-check `config-file: .lychee.toml` input.
# Docusaurus local-link flags come from `docusaurus-root: website` on that
# workflow (--root-dir, --fallback-extensions md,mdx, --index-files
# index.md,index.mdx,.). The /explore React page (src/pages/explore.tsx)
# is excluded in the workflow args, not here.

timeout = 20
max_concurrency = 8
accept = [200, 204, 206, 403, 429]

exclude_path = [
  "node_modules",
  "website/node_modules",
  "website/build",
  ".git",
]

# Common noise / auth walls
exclude = [
  '^https://twitter\\.com/',
  '^https://x\\.com/',
  '^https://www\\.linkedin\\.com/',
  '^https://linkedin\\.com/',
]
